<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>绯英 · 尺刀绯绯狐</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <video id="background-video" muted loop playsinline aria-hidden="true"></video>
  <div class="ambient" aria-hidden="true"></div>
  <svg width="0" height="0" aria-hidden="true"><defs><symbol id="flower" viewBox="0 0 32 32"><g fill="currentColor"><ellipse cx="16" cy="8" rx="4.5" ry="7"/><ellipse cx="16" cy="8" rx="4.5" ry="7" transform="rotate(72 16 16)"/><ellipse cx="16" cy="8" rx="4.5" ry="7" transform="rotate(144 16 16)"/><ellipse cx="16" cy="8" rx="4.5" ry="7" transform="rotate(216 16 16)"/><ellipse cx="16" cy="8" rx="4.5" ry="7" transform="rotate(288 16 16)"/></g><circle cx="16" cy="16" r="3" fill="var(--surface)"/></symbol></defs></svg>
  <div class="shell">
    <header><a class="brand" href="../README.md"><svg class="flower"><use href="#flower"/></svg><span>绯英 <small>FEIYING COMPANION</small></span></a><button id="toggle-theme" class="subtle"><svg class="flower"><use href="#flower"/></svg><span>切换浅色</span></button></header>
    <main>
      <section class="intro">
        <p class="eyebrow">尺刀绯绯狐 · CODEX THEME</p>
        <h1>把一点樱色，<br>留在工作之间。</h1>
        <p class="lead">我是尺刀绯绯狐，爱你。<br>陪你写下灵感，也等你慢慢完成。</p>
        <div class="actions"><button id="copy-theme" class="primary"><svg class="flower"><use href="#flower"/></svg>复制当前主题</button><a class="button subtle" href="../assets/pet/spritesheet.png" download="feiying-spritesheet.png">下载桌宠图集 <span>↗</span></a></div>
        <p id="feedback" role="status" aria-live="polite">深色 · 粉紫夜色</p>
        <div class="details"><span><b>09</b> 动作</span><span><b>16</b> 视线方向</span><span><b>73</b> 动画帧</span></div>
      </section>
      <section class="companion" aria-label="桌宠动画预览">
        <div class="halo" aria-hidden="true"></div><svg class="floating-flower one" aria-hidden="true"><use href="#flower"/></svg><svg class="floating-flower two" aria-hidden="true"><use href="#flower"/></svg>
        <canvas id="pet" width="192" height="208" role="img" aria-label="尺刀绯绯狐动画"></canvas>
        <div class="caption"><span class="dot"></span><span id="state-label">待机 · Idle</span></div>
      </section>
      <section class="controls" aria-label="预览控制">
        <div class="control-head"><h2>她的每一个小动作</h2><p>点击切换，看看绯绯狐的回应。</p></div>
        <div id="states" class="state-buttons"></div>
        <div class="gaze"><label for="gaze">视线方向 <output id="gaze-value">0°</output></label><input id="gaze" type="range" min="0" max="15" step="1" value="0"><button id="look" class="subtle">预览视线</button></div>
        <div class="video-control"><label class="button subtle" for="video-file">选择本地视频背景 <span>＋</span></label><input id="video-file" type="file" accept="video/*"><button id="clear-video" class="subtle" hidden>移除背景</button><span>只在本地浏览器播放</span></div>
      </section>
    </main>
    <footer><p>同人创作 · 非官方项目</p><p>此页面展示花饰按钮与视频背景设计；原生 Codex 使用独立的桌宠与配色导入。</p><a href="https://github.com/sanyierqi01/Evanescia-codex-pet">GitHub ↗</a></footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
